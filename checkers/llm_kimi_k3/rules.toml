# Drafted by tools/new_checker_set.py, then reviewed line by line (3 corrections).
# Clause keys are defined in catalog/clauses.toml; OTHER = not a catalog clause.
[rules]
A_RST_AWVALID_LOW = "OTHER"  # remain deasserted at least until the rising ACLK edge after ARESETn is HIGH.
A_RST_WVALID_LOW = "OTHER"  # SPEC: A2.1.2 p.27 / A2.3 p.29: VALID signals must be LOW during reset (W channel).
A_RST_BVALID_LOW = "OTHER"  # SPEC: A2.1.2 p.27 / A2.3 p.29: VALID signals must be LOW during reset (B channel).
A_RST_ARVALID_LOW = "OTHER"  # SPEC: A2.1.2 p.27 / A2.3 p.29: VALID signals must be LOW during reset (AR channel).
A_RST_RVALID_LOW = "OTHER"  # SPEC: A2.1.2 p.27 / A2.3 p.29: VALID signals must be LOW during reset (R channel).
A_AWVALID_HOLD = "HS_VALID_HOLD"  # handshake occurs at a rising clock edge when VALID and READY are both asserted.
A_WVALID_HOLD = "HS_VALID_HOLD"  # SPEC: A2.3 p.29: Asserted VALID must remain asserted until handshake (W).
A_BVALID_HOLD = "HS_VALID_HOLD"  # SPEC: A2.3 p.29: Asserted VALID must remain asserted until handshake (B).
A_ARVALID_HOLD = "HS_VALID_HOLD"  # SPEC: A2.3 p.29: Asserted VALID must remain asserted until handshake (AR).
A_RVALID_HOLD = "HS_VALID_HOLD"  # SPEC: A2.3 p.29: Asserted VALID must remain asserted until handshake (R).
A_AW_STABLE = "HS_INFO_STABLE"  # transfer occurs (AW payload).
A_W_STABLE = "HS_INFO_STABLE"  # SPEC: A2.3 p.29: Payload stable until transfer occurs (W payload).
A_B_STABLE = "HS_INFO_STABLE"  # SPEC: A2.3 p.29: Payload stable until transfer occurs (B payload).
A_AR_STABLE = "HS_INFO_STABLE"  # SPEC: A2.3 p.29: Payload stable until transfer occurs (AR payload).
A_R_STABLE = "HS_INFO_STABLE"  # SPEC: A2.3 p.29: Payload stable until transfer occurs (R payload).
A_AW_SIZE_MAX = "OTHER"  # SPEC: A3.1.1 p.43: Size must not exceed the data width of the interface.
A_AW_BURST_RSVD = "BURST_RESERVED"  # SPEC: A3.1.4 p.46 (Table A3.9): AxBURST encoding 0b11 is RESERVED.
A_AW_WRAP_LEN = "WRAP_LEN"  # SPEC: A3.1.2 p.44 / A3.1.4 p.47: For wrapping bursts, Length can be 2, 4, 8, or 16.
A_AW_WRAP_ALIGN = "OTHER"  # SPEC: A3.1.4 p.47: For WRAP the start address must be aligned to the size of each transfer
A_AW_FIXED_LEN = "FIXED_LEN"  # SPEC: A3.1.2 p.44 / A3.1.4 p.47: For fixed bursts, Length can be up to 16 transfers.
A_AW_INCR_4KB = "NO_4KB_CROSS"  # SPEC: A3.1 p.43 / A3.1.2 p.44: A transaction must not cross a 4KB address boundary.
A_AW_FIXED_4KB = "NO_4KB_CROSS"  # SPEC: A3.1 p.43: A (fixed-burst) transaction must not cross a 4KB address boundary.
A_AW_CACHE_RSVD = "OTHER"  # SPEC: A4.3 p.71 (Table A4.4): AxCACHE values not shown in the table are reserved.
A_AW_EXCL_ALIGN = "EXCL_ALIGN"  # of bytes in the transaction (Size * Length).
A_AW_EXCL_LEN16 = "EXCL_LEN"  # SPEC: A6.3.3 p.111: The Length of an exclusive access must not exceed 16 transfers.
A_AW_EXCL_POW2 = "EXCL_POW2"  # SPEC: A6.3.3 p.111: Bytes transferred in an exclusive access must be a power of 2.
A_AW_EXCL_MAX128 = "OTHER"  # SPEC: A6.3.3 p.111: Exclusive access byte count is 1,2,...,128 (max 128 bytes).
A_AW_EXCL_RD_FIRST = "EXCL_WRITE_AFTER_READ"  # access sequence until the read part is complete (same ID locked read done).
A_AR_SIZE_MAX = "OTHER"  # SPEC: A3.1.1 p.43: Size must not exceed the data width of the interface.
A_AR_BURST_RSVD = "BURST_RESERVED"  # SPEC: A3.1.4 p.46 (Table A3.9): AxBURST encoding 0b11 is RESERVED.
A_AR_WRAP_LEN = "WRAP_LEN"  # SPEC: A3.1.2 p.44 / A3.1.4 p.47: For wrapping bursts, Length can be 2, 4, 8, or 16.
A_AR_WRAP_ALIGN = "OTHER"  # SPEC: A3.1.4 p.47: For WRAP the start address must be aligned to the size of each transfer
A_AR_FIXED_LEN = "FIXED_LEN"  # SPEC: A3.1.2 p.44 / A3.1.4 p.47: For fixed bursts, Length can be up to 16 transfers.
A_AR_INCR_4KB = "NO_4KB_CROSS"  # SPEC: A3.1 p.43 / A3.1.2 p.44: A transaction must not cross a 4KB address boundary.
A_AR_FIXED_4KB = "NO_4KB_CROSS"  # SPEC: A3.1 p.43: A (fixed-burst) transaction must not cross a 4KB address boundary.
A_AR_CACHE_RSVD = "OTHER"  # SPEC: A4.3 p.71 (Table A4.4): AxCACHE values not shown in the table are reserved.
A_AR_EXCL_ALIGN = "EXCL_ALIGN"  # SPEC: A6.3.3 p.111: Exclusive access address must be aligned to Size * Length.
A_AR_EXCL_LEN16 = "EXCL_LEN"  # SPEC: A6.3.3 p.111: The Length of an exclusive access must not exceed 16 transfers.
A_AR_EXCL_POW2 = "EXCL_POW2"  # SPEC: A6.3.3 p.111: Bytes transferred in an exclusive access must be a power of 2.
A_AR_EXCL_MAX128 = "OTHER"  # SPEC: A6.3.3 p.111: Exclusive access transfers at most 128 bytes.
A_W_WLAST_ON_FINAL = "WLAST"  # write transfer in the transaction (beat count from AWLEN, A3.1.2 p.44).
A_W_WLAST_NOT_EARLY = ["WLAST", "EARLY_TERM"]  # write transfer; early termination of transactions is not supported.
A_W_STRB_IN_CONTAINER = "OTHER"  # be LOW (container byte lanes per the equations of A3.1.6 p.49-50).
A_W_LEADING_LEN_MATCH = "WLAST"  # according to Length - also when write data leads the request (A2.6 p.41).
A_B_AFTER_COMPLETE = "DEP_B_AFTER_W"  # SPEC: A5.5 p.100: The BID of a write response must match the AWID of the request.
A_B_EXOKAY_EXCL = "EXOKAY_WRITE"  # SPEC: A3.3.1 p.62 (Table A3.28): EXOKAY is only permitted for an exclusive write.
A_R_AFTER_REQ = "DEP_R_AFTER_AR"  # A5.6 p.101: RID must match the ARID of the request being responded to.
A_R_LAST_ON_FINAL = "RLAST"  # final read transfer in the transaction (beat count from ARLEN, A3.1.2 p.44).
A_R_LAST_NOT_EARLY = ["RLAST", "EARLY_TERM"]  # indicated by Length must be completed.
A_R_EXOKAY_EXCL = "EXOKAY_READ"  # SPEC: A3.3.2 p.63 (Table A3.31): EXOKAY is only permitted for an exclusive read.
A_R_EXOKAY_CONSISTENT = "EXCL_READ_NO_MIX"  # responses for a single (exclusive read) transaction.
